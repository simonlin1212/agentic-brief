name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest --cov=agentic_brief --cov-report=term-missing
