<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Brief Google Cloud architecture</title>
  <desc id="desc">Cloud Scheduler invokes a private Cloud Run agent workflow. Independent news and video scouts collect evidence, an editor synthesizes it, Firestore stores the briefing, and a public Cloud Run service displays it.</desc>
  <defs>
    <style>
      .bg{fill:#f1efdf}.ink{fill:#101510}.panel{fill:#fffef5;stroke:#101510;stroke-width:3}.cloud{fill:#eaf0ff;stroke:#3f6fd9;stroke-width:3}.accent{fill:#d7ff44;stroke:#101510;stroke-width:3}.muted{fill:#697067}.dash{fill:none;stroke:#697067;stroke-width:2;stroke-dasharray:8 8}.arrow{fill:none;stroke:#101510;stroke-width:4;marker-end:url(#head)}.thin{fill:none;stroke:#697067;stroke-width:3;marker-end:url(#head2)}.title{font:700 48px Georgia,serif}.h{font:700 24px Arial,sans-serif}.b{font:500 18px Arial,sans-serif}.small{font:700 14px monospace;letter-spacing:1px}.tiny{font:500 14px Arial,sans-serif}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#101510"/></marker>
    <marker id="head2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#697067"/></marker>
  </defs>
  <rect class="bg" width="1600" height="960"/>
  <circle cx="1440" cy="90" r="190" fill="#d7ff44" opacity=".35"/>
  <text x="70" y="82" class="small">GOOGLE ALL THINGS AGENTIC HACKATHON</text>
  <text x="70" y="145" class="title">Agentic Brief architecture</text>
  <text x="70" y="180" class="b muted">Autonomous collection, independent judgment, explicit evidence quality.</text>

  <rect x="65" y="285" width="250" height="140" rx="8" class="cloud"/>
  <text x="95" y="325" class="small">TRIGGER</text>
  <text x="95" y="365" class="h">Cloud Scheduler</text>
  <text x="95" y="395" class="tiny">07:00 Asia/Singapore</text>
  <text x="95" y="417" class="tiny">OIDC-authenticated POST</text>

  <rect x="390" y="235" width="775" height="530" rx="10" class="cloud"/>
  <text x="425" y="278" class="small">PRIVATE CLOUD RUN · RUNNER</text>
  <rect x="425" y="305" width="705" height="385" rx="8" class="panel"/>
  <text x="455" y="345" class="small">GOOGLE ADK · SEQUENTIAL WORKFLOW</text>

  <rect x="455" y="375" width="645" height="180" rx="8" class="dash"/>
  <text x="480" y="408" class="small muted">ISOLATED COLLECTORS · NO SHARED STATE</text>
  <rect x="480" y="430" width="275" height="95" rx="6" class="accent"/>
  <text x="505" y="467" class="h">News Scout</text>
  <text x="505" y="497" class="tiny">Financial + central-bank RSS</text>
  <rect x="800" y="430" width="275" height="95" rx="6" class="accent"/>
  <text x="825" y="467" class="h">Video Scout</text>
  <text x="825" y="497" class="tiny">YouTube search + video reading</text>

  <rect x="595" y="590" width="335" height="72" rx="6" class="panel"/>
  <text x="625" y="620" class="h">Editor Agent</text>
  <text x="625" y="647" class="tiny">Signals · contradictions · thin ice</text>
  <path d="M618 525V568H700V590" class="thin"/>
  <path d="M938 525V568H825V590" class="thin"/>
  <text x="425" y="728" class="tiny">Gemini 3.5 Flash · Vertex AI global</text>

  <rect x="1225" y="245" width="305" height="140" rx="8" class="panel"/>
  <text x="1255" y="283" class="small">LIVE SOURCES</text>
  <text x="1255" y="320" class="h">News + YouTube</text>
  <text x="1255" y="350" class="tiny">Trusted channels · 24h window</text>
  <path d="M1225 325H1110" class="thin"/>

  <rect x="1225" y="470" width="305" height="140" rx="8" class="cloud"/>
  <text x="1255" y="508" class="small">DURABLE STATE</text>
  <text x="1255" y="545" class="h">Cloud Firestore</text>
  <text x="1255" y="575" class="tiny">Immutable runs + latest pointer</text>
  <path d="M930 626H1180V540H1225" class="arrow"/>

  <rect x="1030" y="730" width="500" height="145" rx="8" class="cloud"/>
  <text x="1060" y="770" class="small">PUBLIC CLOUD RUN · READ ONLY</text>
  <text x="1060" y="810" class="h">Briefing viewer + JSON API</text>
  <text x="1060" y="842" class="tiny">Responsive UI · no route can trigger model calls</text>
  <path d="M1378 610V730" class="arrow"/>

  <rect x="65" y="735" width="250" height="140" rx="8" class="panel"/>
  <text x="95" y="775" class="small">SECURITY</text>
  <text x="95" y="812" class="h">Secret Manager</text>
  <text x="95" y="842" class="tiny">Restricted YouTube API key</text>
  <path d="M315 805H355V690H425" class="thin"/>

  <path d="M315 355H390" class="arrow"/>
  <text x="70" y="925" class="small muted">ANONYMOUS RUNNER REQUESTS → HTTP 403 · SCHEDULER IDENTITY → ROLES/RUN.INVOKER</text>
</svg>
